<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkoutTracker" />
  <title>Workout Tracker Pro</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root{
      --bg:#0a0f18;
      --bg-2:#0d1420;
      --panel:rgba(20,28,42,.88);
      --panel-2:rgba(26,37,56,.92);
      --line:rgba(255,255,255,.08);
      --line-2:rgba(255,255,255,.12);
      --text:#f4f7fb;
      --muted:#99a9bd;
      --blue:#6ea8ff;
      --green:#7ce3a7;
      --yellow:#ffd36a;
      --red:#ff8585;
      --purple:#bfa1ff;
      --shadow:0 10px 28px rgba(0,0,0,.28);
      --radius:20px;
      --radius-sm:16px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --maxw:480px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;
      background:
      radial-gradient(circle at top left, rgba(110,168,255,.12), transparent 28%),
      radial-gradient(circle at top right, rgba(124,227,167,.09), transparent 28%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
      color:var(--text);
      font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
      min-height:100%;
    }
    body{
      font-size:14px;
      display:flex;
      justify-content:center;
    }

    .app{
      width:100%;
      max-width:var(--maxw);
      min-height:100dvh;
      position:relative;
      padding-top:calc(12px + var(--safe-top));
      padding-bottom:calc(92px + var(--safe-bottom));
    }

    .screen{
      display:none;
      padding:14px;
      animation:fade .18s ease;
    }
    .screen.active{display:block}
    @keyframes fade{
      from{opacity:.5;transform:translateY(4px)}
      to{opacity:1;transform:translateY(0)}
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:14px;
    }

    .title{
      font-size:22px;
      font-weight:900;
      letter-spacing:-.3px;
    }

    .sub{
      color:var(--muted);
      margin-top:4px;
      font-size:13px;
      line-height:1.4;
    }

    .glass{
      background:var(--panel);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .card{
      padding:14px;
      margin-bottom:12px;
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .section-title h2,
    .section-title h3{
      margin:0;
      font-size:17px;
    }

    .muted{color:var(--muted)}
    .small{font-size:12px;color:var(--muted)}
    .tiny{font-size:11px;color:var(--muted)}

    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .col{display:grid;gap:8px}

    button, input, select, textarea{
      font:inherit;
    }

    button{
      min-height:44px;
      border:none;
      border-radius:14px;
      padding:11px 14px;
      color:var(--text);
      background:var(--panel-2);
      border:1px solid var(--line);
      cursor:pointer;
      transition:.15s ease;
    }
    button:active{transform:scale(.98)}

    button.primary{
      background:linear-gradient(135deg,var(--blue),#4f86ff);
      color:#08111d;
      font-weight:900;
      border:none;
    }
    button.green{
      background:linear-gradient(135deg,var(--green),#5fd694);
      color:#08140d;
      font-weight:900;
      border:none;
    }
    button.yellow{
      background:linear-gradient(135deg,var(--yellow),#ffc24c);
      color:#251a03;
      font-weight:900;
      border:none;
    }
    button.red{
      background:linear-gradient(135deg,var(--red),#ff6767);
      color:#220808;
      font-weight:900;
      border:none;
    }
    button.purple{
      background:linear-gradient(135deg,var(--purple),#a786ff);
      color:#1a0f2a;
      font-weight:900;
      border:none;
    }
    button.ghost{
      background:transparent;
    }

    input, select, textarea{
      width:100%;
      min-height:44px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:11px 12px;
      outline:none;
    }

    textarea{
      min-height:82px;
      resize:vertical;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      padding:6px 10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      font-size:12px;
      color:var(--muted);
    }

    .hero{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:10px;
    }

    .hero-item{
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      padding:12px;
    }

    .hero-value{
      font-size:22px;
      font-weight:900;
      margin-top:4px;
    }

    .exercise-list{
      display:grid;
      gap:8px;
    }

    .exercise-row{
      display:grid;
      grid-template-columns:1fr 110px;
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:16px;
      padding:10px;
    }

    .exercise-name{
      font-weight:800;
      font-size:14px;
    }

    .exercise-sub{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .stepper{
      display:flex;
      gap:6px;
      align-items:center;
    }

    .stepper button{
      width:44px;
      min-width:44px;
      padding:0;
    }

    .stepper input{
      text-align:center;
      padding:10px 6px;
    }

    .toggle-tabs{
      display:flex;
      gap:8px;
    }

    .toggle-tabs button{
      flex:1;
    }

    .toggle-tabs button.active{
      background:linear-gradient(135deg,var(--blue),#4f86ff);
      color:#07101b;
      border:none;
      font-weight:900;
    }

    .calendar-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      gap:8px;
    }

    .calendar-wrap{
      touch-action:pan-y;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
    }

    .weekday{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      padding:8px 0;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      font-weight:800;
    }

    .day{
      min-height:72px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      padding:6px;
      display:flex;
      flex-direction:column;
      gap:6px;
      cursor:pointer;
    }

    .day.other{opacity:.28}
    .day.today{outline:2px solid var(--blue)}
    .day.selected{border-color:var(--green)}
    .day-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .day-num{font-weight:900;font-size:13px}
    .badge-wrap{display:flex;flex-wrap:wrap;gap:4px}
    .badge{
      font-size:10px;
      padding:2px 6px;
      border-radius:999px;
      border:1px solid transparent;
      line-height:1.2;
    }
    .b-work{background:rgba(110,168,255,.14);color:#dbe9ff;border-color:rgba(110,168,255,.2)}
    .b-sleep{background:rgba(191,161,255,.14);color:#eadfff;border-color:rgba(191,161,255,.2)}
    .b-sore{background:rgba(255,211,106,.14);color:#ffefbc;border-color:rgba(255,211,106,.2)}

    .progress-card{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:16px;
      padding:12px;
      margin-bottom:8px;
    }

    .progress{
      width:100%;
      height:10px;
      background:#09111a;
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }

    .bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--blue),var(--green));
    }

    .bars{
      display:grid;
      gap:8px;
    }

    .bar-row{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:16px;
      padding:12px;
    }

    .hbar{
      width:100%;
      height:12px;
      border-radius:999px;
      overflow:hidden;
      background:#09111a;
      border:1px solid var(--line);
      margin-top:8px;
    }

    .hfill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--purple),var(--blue));
    }

    .list{
      display:grid;
      gap:8px;
    }

    .item{
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      padding:12px;
    }

    .empty{
      border-radius:16px;
      border:1px dashed var(--line-2);
      background:rgba(255,255,255,.03);
      padding:12px;
      color:var(--muted);
    }

    .nav{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:100%;
      max-width:var(--maxw);
      padding:8px 12px calc(8px + var(--safe-bottom));
      background:rgba(10,15,24,.94);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--line);
      z-index:50;
    }

    .nav-inner{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .tab-btn{
      min-height:56px;
      border-radius:16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-size:12px;
      color:var(--muted);
    }

    .tab-btn.active{
      color:var(--text);
      background:linear-gradient(135deg,rgba(110,168,255,.2),rgba(124,227,167,.14));
      border-color:rgba(110,168,255,.24);
    }

    .tab-icon{
      font-size:18px;
      line-height:1;
    }

    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%) translateY(20px);
      bottom:calc(84px + var(--safe-bottom));
      width:calc(100% - 28px);
      max-width:420px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(16,24,36,.96);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 10px 24px rgba(0,0,0,.3);
      color:var(--text);
      font-size:14px;
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      z-index:60;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 홈 -->
    <section id="screen-home" class="screen active">
      <div class="header">
        <div>
          <div class="title">홈</div>
          <div class="sub" id="homeDateLabel"></div>
        </div>
        <div class="row">
          <button id="goTodayBtn" class="ghost">오늘</button>
          <div class="pill" id="homeWeekLabel"></div>
        </div>
      </div>

      <div class="glass card">
        <div class="hero">
          <div class="hero-item">
            <div class="muted">오늘 세트</div>
            <div class="hero-value" id="heroDaySets">0</div>
          </div>
          <div class="hero-item">
            <div class="muted">수면 시간</div>
            <div class="hero-value" id="heroSleep">0h</div>
          </div>
        </div>

        <div class="section-title">
          <h2>오늘 운동</h2>
          <div class="row">
            <select id="homeFilter">
              <option value="all">전체</option>
              <option value="home">집</option>
              <option value="gym">헬스장</option>
            </select>
          </div>
        </div>

        <div id="homeExerciseList" class="exercise-list"></div>

        <div class="section-title" style="margin-top:12px;">
          <h2>오늘 수면</h2>
          <span class="pill" id="sleepDurationPill">0h</span>
        </div>

        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <label class="small">취침 시간</label>
            <input type="time" id="sleepStart" />
          </div>
          <div>
            <label class="small">기상 시간</label>
            <input type="time" id="sleepEnd" />
          </div>
        </div>

        <div class="section-title" style="margin-top:12px;">
          <h2>오늘 메모</h2>
        </div>
        <input type="text" id="dayNote" placeholder="한 줄 메모" />

        <div class="row" style="margin-top:12px;">
          <button id="saveHomeBtn" class="primary" style="flex:1;">저장</button>
        </div>
      </div>
    </section>

    <!-- 달력 -->
    <section id="screen-calendar" class="screen">
      <div class="header">
        <div>
          <div class="title">달력</div>
          <div class="sub">날짜를 눌러 홈 탭에서 바로 수정 · 좌우 스와이프로 월 이동</div>
        </div>
      </div>

      <div class="glass card">
        <div class="calendar-head">
          <button id="prevMonthBtn" class="ghost">◀</button>
          <strong id="calendarTitle"></strong>
          <button id="nextMonthBtn" class="ghost">▶</button>
        </div>
        <div id="calendarWrap" class="calendar-wrap">
          <div class="calendar" id="calendar"></div>
        </div>
      </div>
    </section>

    <!-- 통계 -->
    <section id="screen-stats" class="screen">
      <div class="header">
        <div>
          <div class="title">통계</div>
          <div class="sub">주간 / 월간 진행률과 수면 패턴</div>
        </div>
      </div>

      <div class="glass card">
        <div class="toggle-tabs">
          <button id="statsWeekBtn" class="active">주간</button>
          <button id="statsMonthBtn">월간</button>
        </div>
      </div>

      <div class="glass card">
        <div class="section-title">
          <h2>요약</h2>
          <span class="pill" id="statsRangeLabel"></span>
        </div>
        <div class="hero">
          <div class="hero-item">
            <div class="muted">총 세트</div>
            <div class="hero-value" id="statsTotalSets">0</div>
          </div>
          <div class="hero-item">
            <div class="muted">운동일 수</div>
            <div class="hero-value" id="statsWorkoutDays">0</div>
          </div>
        </div>
      </div>

      <div class="glass card">
        <div class="section-title">
          <h2>부위별 세트 달성률</h2>
        </div>
        <div id="progressList"></div>
      </div>

      <div class="glass card">
        <div class="section-title">
          <h2>수면 패턴</h2>
        </div>
        <div id="sleepBars" class="bars"></div>
      </div>

      <div class="glass card">
        <div class="section-title">
          <h2>보고서</h2>
        </div>
        <div class="col">
          <input id="reportTitle" type="text" placeholder="보고서 제목" />
          <div class="row">
            <button id="exportMdBtn" class="purple" style="flex:1;">MD 저장</button>
            <button id="exportHtmlBtn" class="green" style="flex:1;">HTML 저장</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 설정 -->
    <section id="screen-settings" class="screen">
      <div class="header">
        <div>
          <div class="title">설정</div>
          <div class="sub">목표 · 백업 · 복원 · 회복 · 설치</div>
        </div>
      </div>

      <div class="glass card">
        <div class="section-title"><h2>주간 목표 세트</h2></div>
        <div id="goalInputs" class="col"></div>
      </div>

      <div class="glass card">
        <div class="section-title"><h2>회복 기록</h2></div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <select id="soreGroup">
            <option value="어깨">어깨</option>
            <option value="이두">이두</option>
            <option value="삼두">삼두</option>
            <option value="가슴">가슴</option>
            <option value="등">등</option>
            <option value="하체">하체</option>
            <option value="복근">복근</option>
            <option value="종아리">종아리</option>
          </select>
          <button id="startSoreBtn" class="yellow">근육통 시작</button>
        </div>
        <div class="section-title" style="margin-top:10px;"><h3>진행 중</h3></div>
        <div id="activeSoreList" class="list"></div>
      </div>

      <div class="glass card">
        <div class="section-title"><h2>데이터</h2></div>
        <div class="col">
          <button id="installBtn" class="primary" style="display:none;">앱 설치</button>
          <button id="exportJsonBtn">JSON 백업</button>
          <button id="importJsonBtn">JSON 가져오기</button>
          <input id="importFile" type="file" accept=".json" style="display:none;" />
          <button id="clearAllBtn" class="red">전체 데이터 삭제</button>
        </div>
      </div>
    </section>

    <!-- 토스트 -->
    <div id="toast" class="toast"></div>

    <!-- 하단 탭바 -->
    <nav class="nav">
      <div class="nav-inner">
        <button class="tab-btn active" data-screen="home">
          <span class="tab-icon">🏠</span>
          <span>홈</span>
        </button>
        <button class="tab-btn" data-screen="calendar">
          <span class="tab-icon">🗓️</span>
          <span>달력</span>
        </button>
        <button class="tab-btn" data-screen="stats">
          <span class="tab-icon">📊</span>
          <span>통계</span>
        </button>
        <button class="tab-btn" data-screen="settings">
          <span class="tab-icon">⚙️</span>
          <span>설정</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    const STORAGE_KEY = "workoutTrackerPro_pwa_report_v1";

    function getTodayString(){
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth()+1).padStart(2,"0");
      const d = String(now.getDate()).padStart(2,"0");
      return `${y}-${m}-${d}`;
    }

    const TODAY = getTodayString();

    const CONFIG = {
      defaultGoals: { "어깨":13,"이두":10,"삼두":10,"가슴":10,"등":10,"하체":10,"복근":6,"종아리":6 },
      groups: [
        { group:"어깨", items:[
          { id:"shoulder_press", name:"덤벨 숄더 프레스", target:4, muscle:"어깨", place:["home","gym"] },
          { id:"lateral_raise", name:"사레레", target:5, muscle:"어깨", place:["home","gym"] },
          { id:"rear_raise", name:"벤트오버 사레레", target:4, muscle:"어깨", place:["home","gym"] }
        ]},
        { group:"팔", items:[
          { id:"bicep_curl", name:"덤벨 컬", target:10, muscle:"이두", place:["home","gym"] },
          { id:"tricep_extension", name:"오버헤드 트라이셉스 익스텐션", target:10, muscle:"삼두", place:["home","gym"] }
        ]},
        { group:"가슴", items:[
          { id:"flat_press", name:"플랫 벤치", target:4, muscle:"가슴", place:["home","gym"] },
          { id:"incline_press", name:"인클라인 벤치", target:3, muscle:"가슴", place:["home","gym"] },
          { id:"fly", name:"플라이", target:3, muscle:"가슴", place:["home","gym"] }
        ]},
        { group:"등", items:[
          { id:"lat_pulldown", name:"랫풀다운", target:4, muscle:"등", place:["gym"] },
          { id:"pulldown_row", name:"암풀다운/로우", target:6, muscle:"등", place:["home","gym"] }
        ]},
        { group:"하체", items:[
          { id:"squat", name:"스쿼트", target:4, muscle:"하체", place:["home","gym"] },
          { id:"leg_extension", name:"레그 익스텐션", target:3, muscle:"하체", place:["gym"] },
          { id:"leg_curl", name:"레그 컬", target:3, muscle:"하체", place:["home","gym"] }
        ]},
        { group:"복근/종아리", items:[
          { id:"crunch", name:"크런치", target:6, muscle:"복근", place:["home","gym"] },
          { id:"calf_raise", name:"카프 레이즈", target:6, muscle:"종아리", place:["home","gym"] }
        ]}
      ]
    };

    let db = loadDB();
    let selectedDate = TODAY;
    let calendarCursor = new Date(TODAY + "T00:00:00");
    let currentScreen = "home";
    let statsMode = "week";
    let deferredPrompt = null;
    let toastTimer = null;

    function loadDB(){
      const raw = localStorage.getItem(STORAGE_KEY);
      const base = {
        dailyLogs:{},
        sorenessLogs:[],
        settings:{ goals:{...CONFIG.defaultGoals}, placeFilter:"all" }
      };
      if(!raw) return base;

      try{
        const parsed = JSON.parse(raw);
        parsed.dailyLogs ||= {};
        parsed.sorenessLogs ||= [];
        parsed.settings ||= {};
        parsed.settings.goals ||= { ...CONFIG.defaultGoals };
        parsed.settings.placeFilter ||= "all";
        Object.keys(CONFIG.defaultGoals).forEach(k => {
          parsed.settings.goals[k] = CONFIG.defaultGoals[k];
        });

        Object.keys(parsed.dailyLogs).forEach(date => {
          const log = parsed.dailyLogs[date];
          if(typeof log.sleep === "number" && !log.sleepMeta){
            log.sleepMeta = { start:null, end:null, duration:log.sleep };
          }
          if(!log.sleepMeta){
            log.sleepMeta = { start:null, end:null, duration:null };
          }
          log.exercises ||= {};
          log.note ||= "";
        });

        return parsed;
      }catch(e){
        return base;
      }
    }

    function saveDB(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function showToast(message){
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    function fmt(date){
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function pdate(str){ return new Date(str + "T00:00:00"); }
    function dayName(str){ return ["일","월","화","수","목","금","토"][pdate(str).getDay()] + "요일"; }

    function mondayOf(str){
      const d = pdate(str);
      const g = d.getDay();
      const diff = g===0 ? -6 : 1-g;
      d.setDate(d.getDate()+diff);
      return fmt(d);
    }

    function weekRange(str){
      const m = pdate(mondayOf(str));
      const s = new Date(m);
      s.setDate(s.getDate()+6);
      return `${fmt(m)} ~ ${fmt(s)}`;
    }

    function ensureLog(ds){
      if(!db.dailyLogs[ds]){
        db.dailyLogs[ds] = {
          exercises:{},
          sleep:null,
          sleepMeta:{ start:null, end:null, duration:null },
          note:""
        };
      }
      CONFIG.groups.forEach(g => g.items.forEach(it => {
        if(typeof db.dailyLogs[ds].exercises[it.id] !== "number"){
          db.dailyLogs[ds].exercises[it.id] = 0;
        }
      }));
      if(!db.dailyLogs[ds].sleepMeta){
        db.dailyLogs[ds].sleepMeta = { start:null, end:null, duration:null };
      }
      if(typeof db.dailyLogs[ds].note !== "string") db.dailyLogs[ds].note = "";
    }

    function allItems(){
      return CONFIG.groups.flatMap(g => g.items);
    }

    function getItem(id){
      return allItems().find(x => x.id === id);
    }

    function getDayTotal(ds){
      ensureLog(ds);
      return Object.values(db.dailyLogs[ds].exercises).reduce((a,b)=>a+Number(b||0),0);
    }

    function getWeekDates(ds){
      const m = pdate(mondayOf(ds));
      return Array.from({length:7}, (_,i) => {
        const x = new Date(m);
        x.setDate(m.getDate()+i);
        return fmt(x);
      });
    }

    function getMonthDates(y,m){
      const last = new Date(y,m+1,0).getDate();
      return Array.from({length:last},(_,i)=>fmt(new Date(y,m,i+1)));
    }

    function getSleepDuration(start,end){
      if(!start || !end) return null;
      const [sh,sm] = start.split(":").map(Number);
      const [eh,em] = end.split(":").map(Number);
      let startMin = sh*60 + sm;
      let endMin = eh*60 + em;
      if(endMin < startMin) endMin += 24*60;
      const dur = (endMin - startMin) / 60;
      return Math.round(dur * 10) / 10;
    }

    function getWeekStats(ds){
      const dates = getWeekDates(ds);
      const muscles = { "어깨":0,"이두":0,"삼두":0,"가슴":0,"등":0,"하체":0,"복근":0,"종아리":0 };
      let totalSets = 0;
      let workoutDays = 0;

      dates.forEach(d => {
        ensureLog(d);
        const total = getDayTotal(d);
        if(total > 0) workoutDays++;
        Object.entries(db.dailyLogs[d].exercises).forEach(([id,sets]) => {
          const item = getItem(id);
          if(item){
            muscles[item.muscle] += Number(sets || 0);
            totalSets += Number(sets || 0);
          }
        });
      });

      return { dates, muscles, totalSets, workoutDays };
    }

    function getMonthStats(cursor){
      const y = cursor.getFullYear();
      const m = cursor.getMonth();
      const dates = getMonthDates(y,m);
      const muscles = { "어깨":0,"이두":0,"삼두":0,"가슴":0,"등":0,"하체":0,"복근":0,"종아리":0 };
      let totalSets = 0;
      let workoutDays = 0;

      dates.forEach(d => {
        ensureLog(d);
        const total = getDayTotal(d);
        if(total > 0) workoutDays++;
        Object.entries(db.dailyLogs[d].exercises).forEach(([id,sets]) => {
          const item = getItem(id);
          if(item){
            muscles[item.muscle] += Number(sets || 0);
            totalSets += Number(sets || 0);
          }
        });
      });

      return { dates, muscles, totalSets, workoutDays };
    }

    function switchScreen(name){
      currentScreen = name;
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(`screen-${name}`).classList.add("active");
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.screen === name);
      });

      if(name === "home") renderHome();
      if(name === "calendar") renderCalendar();
      if(name === "stats") renderStats();
      if(name === "settings") renderSettings();
    }

    function renderHome(){
      ensureLog(selectedDate);
      const log = db.dailyLogs[selectedDate];
      document.getElementById("homeDateLabel").textContent = `${selectedDate} (${dayName(selectedDate)})`;
      document.getElementById("homeWeekLabel").textContent = weekRange(selectedDate);
      document.getElementById("heroDaySets").textContent = getDayTotal(selectedDate);
      document.getElementById("heroSleep").textContent = `${log.sleepMeta?.duration ?? 0}h`;

      document.getElementById("dayNote").value = log.note || "";
      document.getElementById("sleepStart").value = log.sleepMeta?.start || "";
      document.getElementById("sleepEnd").value = log.sleepMeta?.end || "";
      updateSleepPill();

      const filter = db.settings.placeFilter || "all";
      document.getElementById("homeFilter").value = filter;

      const list = document.getElementById("homeExerciseList");
      list.innerHTML = "";

      allItems()
        .filter(item => filter === "all" || item.place.includes(filter))
        .forEach(item => {
          const val = log.exercises[item.id] || 0;
          const row = document.createElement("div");
          row.className = "exercise-row";
          row.innerHTML = `
            <div>
              <div class="exercise-name">${item.name}</div>
              <div class="exercise-sub">${item.muscle} · 주 목표 ${item.target}세트</div>
            </div>
            <div class="stepper">
              <button data-step="-1" data-id="${item.id}">-</button>
              <input type="number" min="0" value="${val}" data-id="${item.id}" />
              <button data-step="1" data-id="${item.id}">+</button>
            </div>
          `;
          list.appendChild(row);
        });

      list.querySelectorAll("input[data-id]").forEach(input => {
        input.addEventListener("input", e => {
          const id = e.target.dataset.id;
          let v = Number(e.target.value || 0);
          if(v < 0) v = 0;
          db.dailyLogs[selectedDate].exercises[id] = v;
          renderHomeHeroOnly();
        });
      });

      list.querySelectorAll("button[data-step]").forEach(btn => {
        btn.addEventListener("click", e => {
          const id = e.target.dataset.id;
          const step = Number(e.target.dataset.step);
          const input = list.querySelector(`input[data-id="${id}"]`);
          let v = Number(input.value || 0) + step;
          if(v < 0) v = 0;
          input.value = v;
          db.dailyLogs[selectedDate].exercises[id] = v;
          renderHomeHeroOnly();
        });
      });
    }

    function renderHomeHeroOnly(){
      ensureLog(selectedDate);
      document.getElementById("heroDaySets").textContent = getDayTotal(selectedDate);
    }

    function updateSleepPill(){
      const start = document.getElementById("sleepStart").value;
      const end = document.getElementById("sleepEnd").value;
      const dur = getSleepDuration(start,end);
      document.getElementById("sleepDurationPill").textContent = `${dur ?? 0}h`;
      document.getElementById("heroSleep").textContent = `${dur ?? 0}h`;
    }

    function saveHome(){
      ensureLog(selectedDate);
      const start = document.getElementById("sleepStart").value || null;
      const end = document.getElementById("sleepEnd").value || null;
      const duration = getSleepDuration(start,end);

      db.dailyLogs[selectedDate].sleepMeta = { start, end, duration };
      db.dailyLogs[selectedDate].sleep = duration;
      db.dailyLogs[selectedDate].note = document.getElementById("dayNote").value.trim();

      saveDB();
      renderHome();
      renderCalendar();
      renderStats();
      showToast("저장되었습니다");
    }

    function renderCalendar(){
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";

      const y = calendarCursor.getFullYear();
      const m = calendarCursor.getMonth();
      document.getElementById("calendarTitle").textContent = `${y}년 ${m+1}월`;

      ["월","화","수","목","금","토","일"].forEach(w => {
        const d = document.createElement("div");
        d.className = "weekday";
        d.textContent = w;
        cal.appendChild(d);
      });

      const first = new Date(y,m,1);
      let offset = first.getDay();
      offset = offset === 0 ? 6 : offset - 1;
      const start = new Date(first);
      start.setDate(first.getDate() - offset);

      for(let i=0;i<42;i++){
        const d = new Date(start);
        d.setDate(start.getDate()+i);
        const ds = fmt(d);
        ensureLog(ds);

        const total = getDayTotal(ds);
        const sleep = db.dailyLogs[ds]?.sleepMeta?.duration;
        const activeSore = db.sorenessLogs.filter(x => ds >= x.startedAt && (!x.recoveredAt || ds <= x.recoveredAt));

        const cell = document.createElement("div");
        cell.className = "day";
        if(d.getMonth() !== m) cell.classList.add("other");
        if(ds === TODAY) cell.classList.add("today");
        if(ds === selectedDate) cell.classList.add("selected");
        cell.innerHTML = `
          <div class="day-top">
            <span class="day-num">${d.getDate()}</span>
          </div>
          <div class="badge-wrap">
            ${total > 0 ? `<span class="badge b-work">운동</span>` : ""}
            ${typeof sleep === "number" ? `<span class="badge b-sleep">${sleep}h</span>` : ""}
            ${activeSore.length ? `<span class="badge b-sore">${activeSore.length}통</span>` : ""}
          </div>
        `;
        cell.addEventListener("click", () => {
          selectedDate = ds;
          switchScreen("home");
        });
        cal.appendChild(cell);
      }
    }

    function renderStats(){
      const isWeek = statsMode === "week";
      const data = isWeek ? getWeekStats(selectedDate) : getMonthStats(calendarCursor);

      document.getElementById("statsRangeLabel").textContent =
        isWeek
          ? weekRange(selectedDate)
          : `${calendarCursor.getFullYear()}-${String(calendarCursor.getMonth()+1).padStart(2,"0")}`;

      document.getElementById("statsTotalSets").textContent = data.totalSets;
      document.getElementById("statsWorkoutDays").textContent = data.workoutDays;

      const goals = db.settings.goals || CONFIG.defaultGoals;
      const progressList = document.getElementById("progressList");
      progressList.innerHTML = "";

      Object.entries(goals).forEach(([muscle,target]) => {
        const val = data.muscles[muscle] || 0;
        const pct = Math.min(100, Math.round((val/target)*100));
        const div = document.createElement("div");
        div.className = "progress-card";
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <strong>${muscle}</strong>
            <span class="small">${val}/${target}</span>
          </div>
          <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
        `;
        progressList.appendChild(div);
      });

      const dates = isWeek
        ? getWeekDates(selectedDate)
        : getMonthDates(calendarCursor.getFullYear(), calendarCursor.getMonth()).slice(-7);

      const sleepBars = document.getElementById("sleepBars");
      sleepBars.innerHTML = "";
      const maxSleep = Math.max(1, ...dates.map(d => db.dailyLogs[d]?.sleepMeta?.duration || 0));

      dates.forEach(d => {
        const sleep = db.dailyLogs[d]?.sleepMeta?.duration || 0;
        const pct = Math.round((sleep/maxSleep)*100);
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <strong>${d.slice(5)}</strong>
            <span class="small">${sleep}h</span>
          </div>
          <div class="hbar"><div class="hfill" style="width:${pct}%"></div></div>
        `;
        sleepBars.appendChild(row);
      });

      document.getElementById("statsWeekBtn").classList.toggle("active", isWeek);
      document.getElementById("statsMonthBtn").classList.toggle("active", !isWeek);
    }

    function renderSettings(){
      const goalInputs = document.getElementById("goalInputs");
      goalInputs.innerHTML = "";
      const goals = db.settings.goals || CONFIG.defaultGoals;

      Object.entries(goals).forEach(([muscle,val]) => {
        const wrap = document.createElement("div");
        wrap.innerHTML = `
          <label class="small">${muscle}</label>
          <input type="number" min="0" value="${val}" data-goal="${muscle}" />
        `;
        goalInputs.appendChild(wrap);
      });

      goalInputs.querySelectorAll("input[data-goal]").forEach(input => {
        input.addEventListener("input", e => {
          const key = e.target.dataset.goal;
          db.settings.goals[key] = Math.max(0, Number(e.target.value || 0));
          saveDB();
        });
      });

      const active = db.sorenessLogs.filter(x => !x.recoveredAt).sort((a,b)=>b.startedAt.localeCompare(a.startedAt));
      const list = document.getElementById("activeSoreList");
      list.innerHTML = active.length ? "" : `<div class="empty">진행 중인 근육통 기록이 없습니다.</div>`;

      active.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <strong>${item.group}</strong>
              <div class="small">시작: ${item.startedAt}</div>
            </div>
            <button data-resolve="${item.id}" class="green">회복됨</button>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll("[data-resolve]").forEach(btn => {
        btn.addEventListener("click", e => {
          const id = e.target.dataset.resolve;
          const target = db.sorenessLogs.find(x => x.id === id);
          if(target){
            target.recoveredAt = selectedDate;
            saveDB();
            renderSettings();
            renderCalendar();
            showToast("회복 처리되었습니다");
          }
        });
      });
    }

    function exportJSON(){
      const blob = new Blob([JSON.stringify(db,null,2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "workout_tracker_backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSON 백업을 저장했어요");
    }

    function importJSON(file){
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const parsed = JSON.parse(e.target.result);
          if(!parsed.dailyLogs || !parsed.sorenessLogs){
            showToast("올바른 백업 파일이 아닙니다");
            return;
          }
          db = loadDBMerge(parsed);
          saveDB();
          renderAll();
          showToast("가져오기 완료");
        }catch(err){
          showToast("파일 읽기 오류");
        }
      };
      reader.readAsText(file);
    }

    function loadDBMerge(parsed){
      parsed.settings ||= {};
      parsed.settings.goals ||= { ...CONFIG.defaultGoals };
      parsed.settings.placeFilter ||= "all";
      Object.keys(parsed.dailyLogs || {}).forEach(date => {
        const log = parsed.dailyLogs[date];
        log.exercises ||= {};
        log.note ||= "";
        if(typeof log.sleep === "number" && !log.sleepMeta){
          log.sleepMeta = { start:null, end:null, duration:log.sleep };
        }
        if(!log.sleepMeta){
          log.sleepMeta = { start:null, end:null, duration:null };
        }
      });
      return parsed;
    }

    function clearAll(){
      if(!confirm("전체 데이터를 삭제할까요?")) return;
      db = {
        dailyLogs:{},
        sorenessLogs:[],
        settings:{ goals:{...CONFIG.defaultGoals}, placeFilter:"all" }
      };
      saveDB();
      renderAll();
      showToast("전체 데이터를 삭제했어요");
    }

    function buildReportMarkdown(){
      const isWeek = statsMode === "week";
      const dates = isWeek ? getWeekDates(selectedDate) : getMonthDates(calendarCursor.getFullYear(), calendarCursor.getMonth());
      const data = isWeek ? getWeekStats(selectedDate) : getMonthStats(calendarCursor);

      let md = `# ${document.getElementById("reportTitle").value.trim() || "운동 보고서"}\n\n`;
      md += `- 범위: ${isWeek ? "주간" : "월간"}\n`;
      md += `- 생성일: ${TODAY}\n`;
      md += `- 총 세트: ${data.totalSets}\n`;
      md += `- 운동일 수: ${data.workoutDays}\n\n`;
      md += `## 부위별 세트\n`;
      Object.entries(data.muscles).forEach(([k,v]) => md += `- ${k}: ${v}세트\n`);
      md += `\n## 날짜별 기록\n`;

      dates.forEach(d => {
        ensureLog(d);
        const total = getDayTotal(d);
        const sleep = db.dailyLogs[d].sleepMeta?.duration;
        const note = db.dailyLogs[d].note;
        if(total === 0 && !sleep && !note) return;
        md += `\n### ${d} (${dayName(d)})\n`;
        md += `- 총 세트: ${total}\n`;
        md += `- 수면: ${sleep ?? "-"}h\n`;
        if(note) md += `- 메모: ${note}\n`;
        Object.entries(db.dailyLogs[d].exercises).forEach(([id,sets]) => {
          if(Number(sets) > 0){
            md += `  - ${getItem(id)?.name || id}: ${sets}세트\n`;
          }
        });
      });

      return md;
    }

    function buildReportHTML(){
      const title = document.getElementById("reportTitle").value.trim() || "운동 보고서";
      const isWeek = statsMode === "week";
      const dates = isWeek ? getWeekDates(selectedDate) : getMonthDates(calendarCursor.getFullYear(), calendarCursor.getMonth());
      const data = isWeek ? getWeekStats(selectedDate) : getMonthStats(calendarCursor);

      const rows = dates.map(d => {
        ensureLog(d);
        const total = getDayTotal(d);
        const sleep = db.dailyLogs[d].sleepMeta?.duration;
        const note = db.dailyLogs[d].note;
        if(total === 0 && !sleep && !note) return "";
        const ex = Object.entries(db.dailyLogs[d].exercises)
          .filter(([,v]) => Number(v) > 0)
          .map(([id,v]) => `<li>${escapeHtml(getItem(id)?.name || id)}: ${v}세트</li>`)
          .join("");
        return `
          <section class="card">
            <h3>${d} (${dayName(d)})</h3>
            <p>총 세트: ${total} / 수면: ${sleep ?? "-"}h</p>
            ${note ? `<p>메모: ${escapeHtml(note)}</p>` : ""}
            ${ex ? `<ul>${ex}</ul>` : ""}
          </section>
        `;
      }).join("");

      return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${escapeHtml(title)}</title>
<style>
body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f4f6fa;color:#17212f}
.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:16px;margin-bottom:12px}
</style>
</head>
<body>
<h1>${escapeHtml(title)}</h1>
<div class="card">
  <p>총 세트: ${data.totalSets}</p>
  <p>운동일 수: ${data.workoutDays}</p>
</div>
${rows}
</body>
</html>`;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function downloadFile(name, content, type){
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderAll(){
      renderHome();
      renderCalendar();
      renderStats();
      renderSettings();
    }

    function setupCalendarSwipe(){
      const wrap = document.getElementById("calendarWrap");
      let startX = 0;
      let startY = 0;
      let moving = false;

      wrap.addEventListener("touchstart", e => {
        const t = e.changedTouches[0];
        startX = t.clientX;
        startY = t.clientY;
        moving = true;
      }, { passive:true });

      wrap.addEventListener("touchend", e => {
        if(!moving) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        moving = false;

        if(Math.abs(dx) < 40) return;
        if(Math.abs(dx) < Math.abs(dy)) return;

        if(dx < 0){
          calendarCursor.setMonth(calendarCursor.getMonth() + 1);
        }else{
          calendarCursor.setMonth(calendarCursor.getMonth() - 1);
        }
        renderCalendar();
        if(statsMode === "month") renderStats();
      }, { passive:true });
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => switchScreen(btn.dataset.screen));
    });

    document.getElementById("homeFilter").addEventListener("change", e => {
      db.settings.placeFilter = e.target.value;
      saveDB();
      renderHome();
    });

    document.getElementById("sleepStart").addEventListener("input", updateSleepPill);
    document.getElementById("sleepEnd").addEventListener("input", updateSleepPill);
    document.getElementById("saveHomeBtn").addEventListener("click", saveHome);

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() - 1);
      renderCalendar();
      if(statsMode === "month") renderStats();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      calendarCursor.setMonth(calendarCursor.getMonth() + 1);
      renderCalendar();
      if(statsMode === "month") renderStats();
    });

    document.getElementById("statsWeekBtn").addEventListener("click", () => {
      statsMode = "week";
      renderStats();
    });

    document.getElementById("statsMonthBtn").addEventListener("click", () => {
      statsMode = "month";
      renderStats();
    });

    document.getElementById("exportMdBtn").addEventListener("click", () => {
      const title = (document.getElementById("reportTitle").value.trim() || "report").replace(/\s+/g,"_");
      downloadFile(`${title}.md`, buildReportMarkdown(), "text/markdown;charset=utf-8");
      showToast("Markdown 보고서를 저장했어요");
    });

    document.getElementById("exportHtmlBtn").addEventListener("click", () => {
      const title = (document.getElementById("reportTitle").value.trim() || "report").replace(/\s+/g,"_");
      downloadFile(`${title}.html`, buildReportHTML(), "text/html;charset=utf-8");
      showToast("HTML 보고서를 저장했어요");
    });

    document.getElementById("startSoreBtn").addEventListener("click", () => {
      db.sorenessLogs.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        group: document.getElementById("soreGroup").value,
        startedAt: selectedDate,
        recoveredAt: null
      });
      saveDB();
      renderSettings();
      renderCalendar();
      showToast("근육통 시작을 기록했어요");
    });

    document.getElementById("exportJsonBtn").addEventListener("click", exportJSON);
    document.getElementById("importJsonBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if(file) importJSON(file);
    });

    document.getElementById("clearAllBtn").addEventListener("click", clearAll);

    document.getElementById("goTodayBtn").addEventListener("click", () => {
      selectedDate = TODAY;
      calendarCursor = new Date(TODAY + "T00:00:00");
      renderAll();
      switchScreen("home");
      showToast("오늘 날짜로 이동했어요");
    });

    // PWA install
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("installBtn");
      btn.style.display = "block";
    });

    document.getElementById("installBtn").addEventListener("click", async () => {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("installBtn").style.display = "none";
    });

    if("serviceWorker" in navigator){
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }

    setupCalendarSwipe();
    renderAll();
  </script>
</body>
</html>
