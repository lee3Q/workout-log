<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkoutLog">
<meta name="theme-color" content="#0a0f18">
<link rel="manifest" href="manifest.json">
<title>Workout Log</title>
<style>
:root {
  --bg:#0a0f18; --panel:rgba(255,255,255,.04); --card:#141b28; --card2:#1a2236;
  --border:#1e293b; --blue:#3b82f6; --green:#00c896; --red:#ff6b6b;
  --yellow:#ffc107; --purple:#a855f7; --text:#e2e8f0; --muted:#94a3b8;
  --sub:#64748b; --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;
}

/* ── screens ── */
.screen{display:none;padding:0 12px 100px}
.screen.active{display:block}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 12px 0}
.topbar h1{text-align:center;font-size:1rem;font-weight:700;color:var(--green);margin-bottom:8px}

/* ── date bar ── */
.date-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 10px}
.date-bar button{background:var(--card);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.date-bar .date-label{font-size:.85rem;font-weight:600;color:var(--text)}
.date-bar .date-label .dow{color:var(--muted);font-weight:400;font-size:.75rem;margin-left:4px}
.today-btn{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--green);color:#000;border:none;cursor:pointer;margin-left:6px}

/* ── day selector ── */
.day-selector{display:flex;gap:6px;padding:0 0 12px}
.day-btn{flex:1;padding:10px 4px 8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.68rem;font-weight:700;border-radius:10px;cursor:pointer;transition:all .2s;text-align:center}
.day-btn .ico{display:block;font-size:1.1rem;margin-bottom:2px}
.day-btn.active{background:var(--green);color:#000;border-color:var(--green);box-shadow:0 2px 12px #00c89644}

/* ── phase card ── */
.phase{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.phase-head{padding:9px 14px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border)}
.phase-head .dot{width:7px;height:7px;border-radius:50%}
.pw-machine .phase-head{color:var(--muted)}.pw-machine .dot{background:var(--muted)}
.pw-free .phase-head{color:var(--yellow)}.pw-free .dot{background:var(--yellow)}
.pw-main .phase-head{color:var(--green)}.pw-main .dot{background:var(--green)}.pw-main{border-color:#00c89633}
.pw-vol .phase-head{color:var(--blue)}.pw-vol .dot{background:var(--blue)}

/* ── exercise row ── */
.ex-row{border-bottom:1px solid #ffffff08}.ex-row:last-child{border-bottom:none}
.ex-row.open .ex-arrow{transform:rotate(180deg)}
.ex-arrow{transition:transform .25s;color:var(--sub);font-size:.6rem;flex-shrink:0}
.ex-main{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.ex-name{font-size:.82rem;font-weight:500;flex:1;line-height:1.4}
.ex-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:10px;flex-shrink:0}
.ex-target{font-size:.7rem;font-weight:600;color:var(--muted)}
.ex-rir{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:6px}
.rir-easy{background:#ffffff10;color:var(--sub)}.rir-mid{background:#00c89620;color:var(--green)}.rir-hard{background:#ff6b6b20;color:var(--red)}

/* ── sets area ── */
.sets-area{padding:0 14px 10px}
.set-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.set-label{font-size:.65rem;color:var(--sub);width:20px;text-align:center;font-weight:600}
.set-row input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 8px;font-size:.8rem;font-weight:600;text-align:center;outline:none;transition:border-color .2s}
.set-row input:focus{border-color:var(--green)}
.set-row .weight-input{width:72px}.set-row .reps-input{width:50px}
.set-row .unit{font-size:.6rem;color:var(--sub);font-weight:600}
.set-row .del-btn{background:none;border:none;color:var(--sub);font-size:.85rem;cursor:pointer;padding:4px 6px;border-radius:6px}
.set-row .del-btn:active{color:var(--red)}
.add-set-btn{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--panel);border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:6px;font-size:.7rem;font-weight:600;cursor:pointer;width:100%;transition:all .2s}
.add-set-btn:active{border-color:var(--green);color:var(--green)}

/* ── exercise detail accordion ── */
.ex-detail{max-height:0;overflow:hidden;transition:max-height .35s ease}
.ex-row.open .ex-detail{max-height:800px}
.ex-detail-inner{padding:0 14px 12px;border-top:1px solid #ffffff08;padding-top:10px}
.ex-detail-inner h4{font-size:.68rem;font-weight:700;margin-bottom:4px;margin-top:8px}
.ex-detail-inner h4:first-child{margin-top:0}
.ex-detail-inner ul{list-style:none;font-size:.72rem;color:var(--muted);line-height:1.65}
.ex-detail-inner ul li{padding-left:12px;position:relative}
.ex-detail-inner ul li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--sub)}
.ex-detail-inner .warn h4{color:var(--yellow)}.ex-detail-inner .warn ul li::before{background:var(--yellow)}
.ex-detail-inner .danger h4{color:var(--red)}.ex-detail-inner .danger ul li::before{background:var(--red)}
.ex-detail-inner .focus h4{color:var(--blue)}.ex-detail-inner .focus ul li::before{background:var(--blue)}

/* ── section card (sleep, note) ── */
.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.section-title{font-size:.72rem;font-weight:700;color:var(--purple);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sleep-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sleep-row:last-of-type{margin-bottom:0}
.sleep-row label{font-size:.7rem;color:var(--muted);width:50px;flex-shrink:0}
.sleep-row input[type="time"]{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:.82rem;font-weight:600;flex:1;outline:none}
.sleep-row input[type="time"]:focus{border-color:var(--purple)}
.sleep-duration{text-align:center;font-size:.8rem;font-weight:700;color:var(--purple);padding:6px 0 0}

/* ── sleep chart ── */
.sleep-chart{display:flex;align-items:flex-end;gap:4px;height:60px;padding-top:4px;margin-top:10px}
.sleep-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.sleep-bar{width:100%;border-radius:4px 4px 0 0;background:var(--purple);min-height:4px;transition:height .3s;opacity:.8}
.sleep-bar-label{font-size:.55rem;color:var(--sub);font-weight:600}
.sleep-bar-value{font-size:.55rem;color:var(--muted);font-weight:600}

/* ── note ── */
.note-area{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:.78rem;width:100%;resize:vertical;min-height:48px;outline:none;font-family:inherit;line-height:1.5}
.note-area:focus{border-color:var(--green)}

/* ── autosave indicator ── */
.autosave-dot{position:fixed;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .3s;z-index:30}
.autosave-dot.flash{opacity:1}

/* ── calendar ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 8px}
.cal-nav .cal-month{font-size:.85rem;font-weight:700;color:var(--text)}
.cal-nav button{background:var(--card);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{font-size:.6rem;font-weight:700;color:var(--sub);text-align:center;padding:4px 0}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;cursor:pointer;position:relative;font-size:.75rem;font-weight:500;transition:background .15s}
.cal-cell:active{background:var(--panel)}.cal-cell.other{opacity:.25;pointer-events:none}
.cal-cell.today{outline:2px solid var(--blue);outline-offset:-2px}
.cal-cell.selected{background:var(--green);color:#000;font-weight:700}
.cal-cell .badges{display:flex;gap:2px;position:absolute;bottom:3px}
.cal-cell .badge{width:5px;height:5px;border-radius:50%}
.badge-workout{background:var(--blue)}.badge-sleep{background:var(--purple)}.badge-injury{background:var(--red)}

/* ── cal detail ── */
.cal-detail{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px}
.cal-detail-title{font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:8px}
.cal-detail-ex{font-size:.72rem;color:var(--muted);padding:3px 0;border-bottom:1px solid #ffffff08;display:flex;justify-content:space-between}
.cal-detail-ex:last-child{border:none}
.cal-detail-sets{font-size:.65rem;color:var(--sub)}
.cal-detail-sleep{font-size:.72rem;color:var(--purple);margin-top:6px}
.cal-detail-note{font-size:.7rem;color:var(--muted);margin-top:4px;font-style:italic}

/* ── injury ── */
.injury-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:.68rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.8rem;width:100%;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row textarea{min-height:48px;resize:vertical}
.form-row input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7)}
.injury-btn{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:.78rem;font-weight:700;cursor:pointer;width:100%}
.injury-btn:active{opacity:.8}
.injury-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;border-left:3px solid var(--red)}
.injury-card.recovered{border-left-color:var(--green);opacity:.7}
.injury-card-title{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:4px}
.injury-card-desc{font-size:.72rem;color:var(--muted);margin-bottom:6px;line-height:1.5}
.injury-card-dates{font-size:.65rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:8px}
.injury-card-dates span{display:flex;align-items:center;gap:3px}
.injury-card-actions{margin-top:8px;display:flex;gap:6px}
.injury-card-actions button{flex:1;padding:7px 10px;border-radius:8px;font-size:.68rem;font-weight:700;cursor:pointer;border:1px solid var(--border)}
.btn-recover{background:var(--green);color:#000;border-color:var(--green)!important}
.btn-intensity{background:var(--blue);color:#fff;border-color:var(--blue)!important}
.btn-delete{background:var(--card2);color:var(--red)}
.section-label{font-size:.72rem;font-weight:700;color:var(--muted);margin:14px 0 8px;padding-left:2px}

/* ── settings ── */
.setting-group{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.setting-item{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff08;cursor:pointer}
.setting-item:last-child{border:none}
.setting-label{font-size:.78rem;font-weight:500}
.setting-label small{display:block;font-size:.65rem;color:var(--sub);margin-top:2px}
.setting-item .arrow{color:var(--sub);font-size:.7rem}

/* ── bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:20;padding:6px 8px calc(6px + var(--safe-b))}
.nav-btn{flex:1;padding:6px 2px 4px;border:none;background:none;color:var(--sub);font-size:.6rem;font-weight:700;border-radius:10px;cursor:pointer;text-align:center;transition:all .2s}
.nav-btn .ico{display:block;font-size:1.15rem;margin-bottom:1px}
.nav-btn.active{color:var(--green)}

/* ── toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);padding:8px 16px;border-radius:10px;font-size:.72rem;font-weight:600;border:1px solid var(--border);opacity:0;transition:opacity .3s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ── empty state ── */
.empty-state{text-align:center;padding:30px 20px;color:var(--sub);font-size:.78rem}
.empty-state .ico{font-size:2rem;margin-bottom:8px;display:block}
.hidden-input{display:none}
.cal-legend{grid-column:1/-1;display:flex;gap:14px;justify-content:center;padding:10px 0 4px;font-size:.6rem;color:var(--sub)}
.cal-legend .lg-blue{color:var(--blue)}.cal-legend .lg-purple{color:var(--purple)}.cal-legend .lg-red{color:var(--red)}
</style>
</head>
<body>

<div class="autosave-dot" id="autosaveDot"></div>
<div class="toast" id="toast"></div>
<input type="file" accept=".json" class="hidden-input" id="importInput">

<!-- ═══ SCREEN: WORKOUT ═══ -->
<div class="screen active" id="screen-workout">
  <div class="topbar">
    <h1>💪 Workout Log</h1>
    <div class="date-bar">
      <button onclick="shiftDate(-1)">◀</button>
      <div style="display:flex;align-items:center">
        <span class="date-label" id="dateLabel"></span>
        <button class="today-btn" onclick="goToday()">오늘</button>
      </div>
      <button onclick="shiftDate(1)">▶</button>
    </div>
    <div class="day-selector">
      <button class="day-btn" data-day="chest_back" onclick="selectDay('chest_back')"><span class="ico">🏋️</span>가슴+등</button>
      <button class="day-btn" data-day="shoulder_arms" onclick="selectDay('shoulder_arms')"><span class="ico">🔥</span>어깨+팔</button>
      <button class="day-btn" data-day="legs" onclick="selectDay('legs')"><span class="ico">🦵</span>하체</button>
    </div>
  </div>
  <div id="workoutContent"></div>

  <!-- sleep -->
  <div class="section-card" style="margin-top:12px">
    <div class="section-title">😴 수면</div>
    <div class="sleep-row"><label>취침</label><input type="time" id="sleepStart" onchange="onSleepChange()"></div>
    <div class="sleep-row"><label>기상</label><input type="time" id="sleepEnd" onchange="onSleepChange()"></div>
    <div class="sleep-duration" id="sleepDuration"></div>
    <div class="sleep-chart" id="sleepChart"></div>
  </div>

  <!-- note -->
  <div class="section-card">
    <div class="section-title">📝 메모</div>
    <textarea class="note-area" id="noteArea" placeholder="오늘 운동 메모..." oninput="onNoteChange()"></textarea>
  </div>
</div>

<!-- ═══ SCREEN: CALENDAR ═══ -->
<div class="screen" id="screen-calendar">
  <div class="topbar">
    <h1>📅 달력</h1>
    <div class="cal-nav">
      <button onclick="calShift(-1)">◀</button>
      <span class="cal-month" id="calMonth"></span>
      <button onclick="calShift(1)">▶</button>
    </div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div id="calDetail"></div>
</div>

<!-- ═══ SCREEN: INJURY ═══ -->
<div class="screen" id="screen-injury">
  <div class="topbar"><h1>🩹 부상 관리</h1></div>
  <div class="injury-form">
    <div class="form-row">
      <label>부위</label>
      <select id="injuryPart" onchange="onInjuryPartChange()">
        <option value="">선택...</option>
        <option value="어깨">어깨</option><option value="손목">손목</option>
        <option value="팔꿈치">팔꿈치</option><option value="무릎">무릎</option>
        <option value="허리">허리</option><option value="목">목</option>
        <option value="발목">발목</option><option value="고관절">고관절</option>
        <option value="__custom">직접 입력</option>
      </select>
    </div>
    <div class="form-row" id="customPartRow" style="display:none">
      <label>부위 (직접 입력)</label>
      <input type="text" id="injuryPartCustom" placeholder="예: 왼쪽 어깨 전면">
    </div>
    <div class="form-row">
      <label>설명</label>
      <textarea id="injuryDesc" placeholder="어떤 부상인지 간단히..."></textarea>
    </div>
    <div class="form-row">
      <label>부상일</label>
      <input type="date" id="injuryDate">
    </div>
    <button class="injury-btn" onclick="addInjury()">+ 부상 기록</button>
  </div>
  <div class="section-label">🔴 활성 부상</div>
  <div id="activeInjuries"></div>
  <div class="section-label">🟢 회복 완료</div>
  <div id="recoveredInjuries"></div>
</div>

<!-- ═══ SCREEN: SETTINGS ═══ -->
<div class="screen" id="screen-settings">
  <div class="topbar"><h1>⚙️ 설정</h1></div>
  <div class="setting-group">
    <div class="setting-item" onclick="exportBackup()">
      <div class="setting-label">📦 데이터 백업<small>JSON 파일로 전체 데이터 저장</small></div>
      <span class="arrow">→</span>
    </div>
    <div class="setting-item" onclick="document.getElementById('importInput').click()">
      <div class="setting-label">📥 데이터 복원<small>JSON 백업 파일 불러오기</small></div>
      <span class="arrow">→</span>
    </div>
    <div class="setting-item" onclick="clearAllData()">
      <div class="setting-label">🗑️ 전체 초기화<small>모든 기록 삭제</small></div>
      <span class="arrow">→</span>
    </div>
  </div>
  <div class="setting-group">
    <div class="setting-item" id="installBtn" onclick="installPWA()" style="display:none">
      <div class="setting-label">📱 앱 설치<small>홈 화면에 추가</small></div>
      <span class="arrow">→</span>
    </div>
  </div>
  <div style="text-align:center;padding:20px;color:var(--sub);font-size:.65rem">Workout Log v2 · localStorage</div>
</div>

<!-- ═══ BOTTOM NAV ═══ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-screen="workout" onclick="switchScreen('workout')"><span class="ico">💪</span>운동</button>
  <button class="nav-btn" data-screen="calendar" onclick="switchScreen('calendar')"><span class="ico">📅</span>달력</button>
  <button class="nav-btn" data-screen="injury" onclick="switchScreen('injury')"><span class="ico">🩹</span>부상</button>
  <button class="nav-btn" data-screen="settings" onclick="switchScreen('settings')"><span class="ico">⚙️</span>설정</button>
</nav>

<script>
// ═══════════════════════════════════════════
//  ROUTINE DATA
// ═══════════════════════════════════════════
const ROUTINES={
chest_back:[
{phase:'machine_warmup',label:'머신 웜업',phaseClass:'pw-machine',exercises:[
  {name:'체스트 프레스 머신',target:'1×15',rir:{label:'RIR 5+',tier:'easy'},details:[
    {type:'warn',heading:'💡 포인트',items:['아주 가벼운 무게로 관절·근육만 가볍게 깨우는 용도','팔꿈치 각도 60~80° 유지, 어깨가 앞으로 말리지 않게']}
  ]},
  {name:'랫풀다운',target:'1×15',rir:{label:'RIR 5+',tier:'easy'},details:[
    {type:'warn',heading:'💡 포인트',items:['가벼운 중량으로 등·어깨 후면 깨우기','바를 앞쪽으로(목 뒤가 아닌) 가슴 쪽으로 내리기']}

const DAY_NAMES={chest_back:'가슴+등',shoulder_arms:'어깨+팔',legs:'하체'};

//  DATA LAYER
// ═══════════════════════════════════════════
const STORAGE_KEY='workoutTracker_v2';
let db={dailyLogs:{},injuryLogs:[]};
let lastWeights={}; // { "exerciseName": lastWeight }
let selectedDate=todayStr();
let currentScreen='workout';
let calendarCursor=new Date();

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      db.dailyLogs=p.dailyLogs||{};
      db.injuryLogs=p.injuryLogs||[];
      lastWeights=p.lastWeights||{};
    }
  }catch(e){console.error('DB load error',e);}
}

let saveTimer=null;
function saveDB(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    db.lastWeights=lastWeights;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
    flashSave();
  },300);
}

function flashSave(){
  const dot=document.getElementById('autosaveDot');
  dot.classList.add('flash');
  setTimeout(()=>dot.classList.remove('flash'),600);
}

function getLog(date){
  if(!db.dailyLogs[date]){
    db.dailyLogs[date]={dayType:null,exercises:[],sleepMeta:null,note:''};
  }
  return db.dailyLogs[date];
}

function ensureExercises(log,dayType){
  const routine=ROUTINES[dayType];
  if(!routine)return;
  if(log.dayType!==dayType){
    log.dayType=dayType;
    log.exercises=routine.map(p=>({
      phase:p.phase,
      name:null,
      exercises:p.exercises.map(ex=>({name:ex.name,phase:ex.phase||p.phase,sets:[]}))
    }));
  }
  // Sync structure if routine changed
  routine.forEach((p,pi)=>{
    if(!log.exercises[pi]){
      log.exercises[pi]={phase:p.phase,name:null,exercises:p.exercises.map(ex=>({name:ex.name,phase:ex.phase||p.phase,sets:[]})),};
    }
    p.exercises.forEach((ex,ei)=>{
      if(!log.exercises[pi].exercises[ei]){
        log.exercises[pi].exercises[ei]={name:ex.name,phase:ex.phase||p.phase,sets:[]};
      }
    });
  });
}

function selectDay(dayType){

//  RENDER WORKOUT
// ═══════════════════════════════════════════
function renderWorkout(){
  updateDateLabel();
  const log=db.dailyLogs[selectedDate];
  if(!log||!log.dayType){
    document.getElementById('workoutContent').innerHTML='<div class="empty-state"><span class="ico">🏋️</span>오늘 운동 종류를 선택하세요</div>';
  }else{
    renderExercises();
  }
  renderSleepUI();
  renderSleepChart();
  renderNoteUI();
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===(log?log.dayType:null)));
}

function renderExercises(){
  const log=db.dailyLogs[selectedDate];
  if(!log)return;
  const routine=ROUTINES[log.dayType];
  if(!routine)return;
  let html='';
  routine.forEach((phase,pi)=>{
    html+=`<div class="phase ${phase.phaseClass}"><div class="phase-head"><span class="dot"></span> ${phase.label}</div>`;
    phase.exercises.forEach((ex,ei)=>{
      const logEx=log.exercises[pi]&&log.exercises[pi].exercises[ei];
      const sets=logEx?logEx.sets:[];
      const rirClass='rir-'+ex.rir.tier;
      html+=`<div class="ex-row" id="exRow-${pi}-${ei}">
        <div class="ex-main" onclick="toggleEx(${pi},${ei})">
          <span class="ex-name">${ex.name}</span>
          <div class="ex-meta">
            <span class="ex-target">${ex.target}</span>
            <span class="ex-rir ${rirClass}">${ex.rir.label}</span>
            <span class="ex-arrow">▼</span>
          </div>
        </div>
        <div class="sets-area" id="setsArea-${pi}-${ei}">`;
      sets.forEach((s,si)=>{
        html+=`<div class="set-row">
          <span class="set-label">${si+1}</span>
          <input type="number" class="weight-input" placeholder="kg" value="${s.weight||''}" inputmode="decimal"
            onchange="updateSet(${pi},${ei},${si},'weight',this.value)">
          <span class="unit">kg</span>
          <input type="number" class="reps-input" placeholder="회" value="${s.reps||''}" inputmode="numeric"
            onchange="updateSet(${pi},${ei},${si},'reps',this.value)">
          <span class="unit">회</span>
          <button class="del-btn" onclick="removeSet(${pi},${ei},${si})">✕</button>
        </div>`;
      });
      html+=`<button class="add-set-btn" onclick="addSet(${pi},${ei})">+ 세트 추가</button></div>`;
      // Details accordion
      html+=`<div class="ex-detail"><div class="ex-detail-inner">`;
      ex.details.forEach(d=>{
        html+=`<div class="${d.type}"><h4>${d.heading}</h4><ul>`;
        d.items.forEach(item=>{html+=`<li>${item}</li>`;});
        html+=`</ul></div>`;
      });
      html+=`</div></div></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('workoutContent').innerHTML=html;
}

function toggleEx(pi,ei){const row=document.getElementById(`exRow-${pi}-${ei}`);if(row)row.classList.toggle('open');}

function addSet(pi,ei){
  const log=getLog(selectedDate);
  ensureExercises(log,log.dayType);
  if(log.exercises[pi]&&log.exercises[pi].exercises[ei]){
    const exName=log.exercises[pi].exercises[ei].name;
    const defaultW=lastWeights[exName]||0;
    log.exercises[pi].exercises[ei].sets.push({weight:defaultW,reps:0});
    saveDB();
    renderExercises();
    setTimeout(()=>{
      const area=document.getElementById(`setsArea-${pi}-${ei}`);
      if(area){const inputs=area.querySelectorAll('.weight-input');if(inputs.length)inputs[inputs.length-1].focus();}
    },50);
  }
}

function removeSet(pi,ei,si){
  const log=getLog(selectedDate);
  if(log.exercises[pi]&&log.exercises[pi].exercises[ei]){
    log.exercises[pi].exercises[ei].sets.splice(si,1);
    saveDB();renderExercises();
  }
}

function updateSet(pi,ei,si,field,val){
  const log=getLog(selectedDate);
  if(log.exercises[pi]&&log.exercises[pi].exercises[ei]&&log.exercises[pi].exercises[ei].sets[si]){
    log.exercises[pi].exercises[ei].sets[si][field]=parseFloat(val)||0;
    if(field==='weight'){
      const exName=log.exercises[pi].exercises[ei].name;
      const w=parseFloat(val)||0;
      if(w>0)lastWeights[exName]=w;
    }
    saveDB();
  }
}

// ═══════════════════════════════════════════
//  SLEEP
// ═══════════════════════════════════════════
function onSleepChange(){
  const log=getLog(selectedDate);
  const s=document.getElementById('sleepStart').value;
  const e=document.getElementById('sleepEnd').value;
  if(s&&e){
    const dur=calcSleepDuration(s,e);
    log.sleepMeta={start:s,end:e,duration:dur};
    document.getElementById('sleepDuration').textContent=`${dur}시간 수면`;
  }else{
    log.sleepMeta=null;
    document.getElementById('sleepDuration').textContent='';
  }
  saveDB();renderSleepChart();
}

function calcSleepDuration(start,end){
  const[sh,sm]=start.split(':').map(Number);
  const[eh,em]=end.split(':').map(Number);
  let diff=(eh*60+em)-(sh*60+sm);
  if(diff<=0)diff+=24*60;
  return Math.round(diff/60*10)/10;
}

function renderSleepUI(){
  const log=db.dailyLogs[selectedDate];
  const meta=log&&log.sleepMeta;
  document.getElementById('sleepStart').value=meta?meta.start:'';
  document.getElementById('sleepEnd').value=meta?meta.end:'';
  document.getElementById('sleepDuration').textContent=meta?`${meta.duration}시간 수면`:'';
}

function renderSleepChart(){
  const chart=document.getElementById('sleepChart');
  let html='';
  let maxDur=0;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const log=db.dailyLogs[ds];
    const dur=log&&log.sleepMeta&&log.sleepMeta.duration?log.sleepMeta.duration:0;
    if(dur>maxDur)maxDur=dur;
    days.push({ds,dur,label:`${d.getMonth()+1}/${d.getDate()}`});
  }
  if(maxDur===0)maxDur=8;
  days.forEach(day=>{
    const h=day.dur?Math.max(8,(day.dur/maxDur)*52):4;
    const opacity=day.dur?0.8:0.2;
    html+=`<div class="sleep-bar-wrap">
      <div class="sleep-bar-value">${day.dur||'-'}</div>
      <div class="sleep-bar" style="height:${h}px;opacity:${opacity}"></div>
      <div class="sleep-bar-label">${day.label}</div>
    </div>`;
  });
  chart.innerHTML=html;
}

function calShift(delta){calendarCursor.setMonth(calendarCursor.getMonth()+delta);renderCalendar();}
let calSelectedDate=null;

function renderCalendar(){
  const y=calendarCursor.getFullYear();
  const m=calendarCursor.getMonth();
  document.getElementById('calMonth').textContent=`${y}년 ${m+1}월`;
  const firstDay=new Date(y,m,1);
  let startDow=firstDay.getDay();
  startDow=startDow===0?6:startDow-1;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=todayStr();
  const grid=document.getElementById('calGrid');
  let html='';
  ['월','화','수','목','금','토','일'].forEach(d=>{html+=`<div class="cal-head">${d}</div>`;});
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<startDow;i++){html+=`<div class="cal-cell other">${prevDays-startDow+1+i}</div>`;}
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-cell';
    if(ds===today)cls+=' today';
    if(ds===calSelectedDate)cls+=' selected';
    const log=db.dailyLogs[ds];
    let badges='';
    if(log&&log.dayType)badges+='<span class="badge badge-workout"></span>';
    if(log&&log.sleepMeta&&log.sleepMeta.duration)badges+='<span class="badge badge-sleep"></span>';
    if(db.injuryLogs.some(inj=>ds>=inj.injuredAt&&(!inj.recoveredAt||ds<=inj.recoveredAt)))badges+='<span class="badge badge-injury"></span>';
    html+=`<div class="${cls}" onclick="selectCalDate('${ds}')">${d}<div class="badges">${badges}</div></div>`;
  }
  const totalCells=startDow+daysInMonth;
  const remaining=totalCells%7===0?0:7-(totalCells%7);
  for(let i=1;i<=remaining;i++){html+=`<div class="cal-cell other">${i}</div>`;}
  html+=`<div class="cal-legend"><span class="lg-blue">● 운동</span><span class="lg-purple">● 수면</span><span class="lg-red">● 부상</span></div>`;
  grid.innerHTML=html;
  renderCalDetail();
}

function selectCalDate(ds){
  calSelectedDate=calSelectedDate===ds?null:ds;
  renderCalendar();
}

function renderCalDetail(){
  const container=document.getElementById('calDetail');
  if(!calSelectedDate){container.innerHTML='';return;}
  const log=db.dailyLogs[calSelectedDate];
  if(!log||!log.dayType){
    container.innerHTML=`<div class="cal-detail"><div class="cal-detail-title">${calSelectedDate}</div><div style="color:var(--sub);font-size:.72rem">기록 없음</div></div>`;
    return;
  }
  let html=`<div class="cal-detail"><div class="cal-detail-title">${calSelectedDate} — ${DAY_NAMES[log.dayType]||log.dayType}</div>`;
  if(log.exercises){
    log.exercises.forEach(phase=>{
      if(phase.exercises){
        phase.exercises.forEach(ex=>{
          if(ex.sets&&ex.sets.length>0){
            html+=`<div class="cal-detail-ex"><span>${ex.name}</span><span class="cal-detail-sets">${ex.sets.map(s=>`${s.weight}kg×${s.reps}`).join(' / ')}</span></div>`;
          }
        });
      }
    });
  }
  if(log.sleepMeta&&log.sleepMeta.duration){
    html+=`<div class="cal-detail-sleep">😴 ${log.sleepMeta.start} ~ ${log.sleepMeta.end} (${log.sleepMeta.duration}시간)</div>`;
  }
  if(log.note){html+=`<div class="cal-detail-note">📝 ${log.note}</div>`;}
  html+=`</div>`;
  container.innerHTML=html;
}

// ═══════════════════════════════════════════
//  INJURY
// ═══════════════════════════════════════════
function onInjuryPartChange(){
  document.getElementById('customPartRow').style.display=document.getElementById('injuryPart').value==='__custom'?'block':'none';
}
document.getElementById('injuryDate').value=todayStr();

function addInjury(){
  let part=document.getElementById('injuryPart').value;
  if(part==='__custom')part=document.getElementById('injuryPartCustom').value.trim();
  if(!part){showToast('부위를 입력하세요');return;}
  const desc=document.getElementById('injuryDesc').value.trim();
  const date=document.getElementById('injuryDate').value;
  if(!date){showToast('부상일을 입력하세요');return;}
  db.injuryLogs.push({id:genId(),bodyPart:part,description:desc,injuredAt:date,recoveredAt:null,fullIntensityAt:null});
  saveDB();showToast('부상 기록됨');
  document.getElementById('injuryPart').value='';
  document.getElementById('injuryPartCustom').value='';
  document.getElementById('injuryDesc').value='';
  document.getElementById('injuryDate').value=todayStr();
  document.getElementById('customPartRow').style.display='none';
  renderInjuries();
}

function markRecovered(id){
  const inj=db.injuryLogs.find(i=>i.id===id);
  if(inj){inj.recoveredAt=todayStr();saveDB();showToast('회복 처리됨');renderInjuries();}
}

function markFullIntensity(id){
  const inj=db.injuryLogs.find(i=>i.id===id);
  if(inj){inj.fullIntensityAt=todayStr();saveDB();showToast('고강도 복귀일 기록됨');renderInjuries();}
}

function deleteInjury(id){
  if(!confirm('이 부상 기록을 삭제할까요?'))return;
  db.injuryLogs=db.injuryLogs.filter(i=>i.id!==id);
  saveDB();renderInjuries();
}

function renderInjuries(){
  const active=db.injuryLogs.filter(i=>!i.recoveredAt);
  const recovered=db.injuryLogs.filter(i=>i.recoveredAt);
  let html='';
  if(active.length===0){
    html+='<div class="empty-state"><span class="ico">✅</span>활성 부상 없음</div>';
  }else{
    active.forEach(inj=>{
      const daysSince=Math.floor((new Date()-new Date(inj.injuredAt+'T00:00:00'))/86400000);
      html+=`<div class="injury-card">
        <div class="injury-card-title">🔴 ${inj.bodyPart}</div>
        <div class="injury-card-desc">${inj.description||'상세 설명 없음'}</div>
        <div class="injury-card-dates"><span>🗓️ 부상: ${inj.injuredAt}</span><span>⏱️ ${daysSince}일차</span></div>
        <div class="injury-card-actions">
          <button class="btn-recover" onclick="markRecovered('${inj.id}')">✅ 회복됨</button>
          <button class="btn-delete" onclick="deleteInjury('${inj.id}')">🗑️</button>
        </div></div>`;
    });
  }
  document.getElementById('activeInjuries').innerHTML=html;
  html='';
  if(recovered.length===0){
    html+='<div class="empty-state" style="padding:16px"><span style="font-size:.72rem;color:var(--sub)">회복 완료 기록 없음</span></div>';
  }else{
    recovered.forEach(inj=>{
      const recoveryDays=Math.floor((new Date(inj.recoveredAt+'T00:00:00')-new Date(inj.injuredAt+'T00:00:00'))/86400000);
      html+=`<div class="injury-card recovered">
        <div class="injury-card-title">🟢 ${inj.bodyPart}</div>
        <div class="injury-card-desc">${inj.description||''}</div>
        <div class="injury-card-dates">
          <span>🗓️ ${inj.injuredAt} → ${inj.recoveredAt}</span><span>⏱️ ${recoveryDays}일 소요</span>
          ${inj.fullIntensityAt?`<span>💪 고강도 복귀: ${inj.fullIntensityAt}</span>`:''}
        </div>
        <div class="injury-card-actions">
          ${!inj.fullIntensityAt?`<button class="btn-intensity" onclick="markFullIntensity('${inj.id}')">💪 고강도 복귀일</button>`:''}
          <button class="btn-delete" onclick="deleteInjury('${inj.id}')">🗑️</button>
        </div></div>`;
    });
  }
  document.getElementById('recoveredInjuries').innerHTML=html;
}

// ═══════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════
function exportBackup(){
  const data=JSON.stringify(db,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`workout_backup_${todayStr()}.json`;a.click();
  URL.revokeObjectURL(url);showToast('백업 완료');
}

document.getElementById('importInput').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.dailyLogs&&data.injuryLogs){db=data;saveDB();showToast('복원 완료');renderWorkout();}
      else{showToast('잘못된 파일 형식');}
    }catch(err){showToast('파일 읽기 오류');}
  };
  reader.readAsText(file);this.value='';
});

function clearAllData(){
  if(!confirm('모든 운동·부상·수면 기록이 삭제됩니다.\n정말 초기화할까요?'))return;
  db={dailyLogs:{},injuryLogs:[]};
  lastWeights={};
  saveDB();showToast('초기화 완료');renderWorkout();
}

// ═══════════════════════════════════════════
function genId(){
  if(crypto.randomUUID)return crypto.randomUUID();
  return Date.now().toString(36)+Math.random().toString(36).substr(2,9);
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// ═══════════════════════════════════════════
loadDB();

// Reconstruct lastWeights from existing logs (first load / after import)
(function rebuildLastWeights(){
  const dates=Object.keys(db.dailyLogs).sort();
  dates.forEach(date=>{
    const log=db.dailyLogs[date];
    if(!log||!log.exercises)return;
    log.exercises.forEach(phase=>{
      if(!phase||!phase.exercises)return;
      phase.exercises.forEach(ex=>{
        if(!ex||!ex.sets||!ex.name)return;
        // Take the last non-zero weight from the most recent set
        for(let i=ex.sets.length-1;i>=0;i--){
          if(ex.sets[i].weight>0){lastWeights[ex.name]=ex.sets[i].weight;break;}
        }
      });
    });
  });
})();

renderWorkout();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
